name: Update sante mirrors

on:
  schedule:
    - cron: "20 4 * * *"   # 04:20 UTC chaque jour (05:20 heure du Maroc)
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sihatar-mirrors.yml"
      - "assets/data/siha/**"
      - "scripts/sihamaroc-fetch.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sihamaroc (sante) and build JSON
        run: python3 scripts/sihamaroc-fetch.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/siha
          if git diff --cached --quiet; then
            echo "Aucun changement - rien a commettre."
          else
            git commit -m "data: miroir sante sihamaroc (pharmacies/cliniques/labo/medecins/tarifs) [skip ci]"
            git push
          fi
